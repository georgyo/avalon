# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    permissions:
      id-token: "write"
      contents: "read"

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
      - uses: NixOS/nix-installer-action@main
      - uses: Mic92/niks3-action@v1
        with:
          server-url: https://niks3.fu.io

      # `nix flake check` runs checks.unit (`yarn test:unit`: crypto, protocol,
      # simulations, client P2P runtime and relay tests); `nix build` runs the
      # bundled relay's boot self-test as its install check.
      - run: nix flake check
      - run: nix build .#

  # End-to-end tests. These run entirely against a throwaway local stack (the
  # GUN relay on a temporary GUN_DIR and the vite dev server proxying /gun and
  # /api to it) -- see tests/e2e-stack.mjs. Nothing here touches avalon.onl.
  e2e:
    runs-on: ubuntu-latest

    permissions:
      id-token: "write"
      contents: "read"

    steps:
      - uses: actions/checkout@v7
      - uses: NixOS/nix-installer-action@main
      - uses: Mic92/niks3-action@v1
        with:
          server-url: https://niks3.fu.io

      # `nix run .#e2e` pins the whole toolchain (Node and the Playwright
      # browsers) so there's no setup-node / playwright-install dance.
      # PLAYERS=5..10 runs the full game once per player count.
      - name: Run e2e suite
        run: nix run .#e2e
        env:
          PLAYERS: "5..10"

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
          retention-days: 7
